<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Shell</title>

  <!-- xterm.js（自托管，随二进制内嵌，无 CDN） -->
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- 登录面板 -->
  <div id="login-panel">
    <form id="login-form">
      <h1>Web Shell</h1>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username"
             placeholder="请输入账号名或邮箱" autofocus required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             placeholder="请输入 AD 密码" required>
      <button type="submit">登录</button>
      <div id="login-error"></div>
    </form>
  </div>

  <!-- 模式选择面板（历史保留：登录后模式改由会话面板的「新建会话」选择） -->
  <div id="mode-panel" class="hidden">
    <div id="mode-box">
      <h1>选择会话模式</h1>
      <p id="mode-user"></p>
      <button type="button" id="btn-bash">打开 Bash 终端</button>
      <button type="button" id="btn-opencode" class="hidden">打开 OpenCode</button>
      <button type="button" id="btn-codex" class="hidden">打开 Codex</button>
    </div>
  </div>

  <!-- 会话面板：登录后展示会话列表与新建入口 -->
  <div id="session-panel" class="hidden">
    <div id="session-box">
      <div id="session-header">
        <h1>会话管理</h1>
        <div id="session-user"></div>
        <div id="session-counts"></div>
        <button type="button" id="btn-logout">登出</button>
      </div>

      <div id="session-list"></div>
      <div id="session-empty" class="hidden">暂无会话，请在下方新建。</div>

      <div id="session-new">
        <h2>新建会话</h2>
        <div id="new-type">
          <label><input type="radio" name="new-type" id="new-type-long" value="long"> 长期</label>
          <label><input type="radio" name="new-type" id="new-type-short" value="" checked> 临时</label>
        </div>
        <div id="new-hours-wrap" class="hidden">
          <label for="new-hours">时长（小时）</label>
          <input type="number" id="new-hours" min="1" value="24">
        </div>
        <div id="new-modes">
          <button type="button" id="new-mode-bash">Bash</button>
          <button type="button" id="new-mode-opencode" class="hidden">OpenCode</button>
          <button type="button" id="new-mode-codex" class="hidden">Codex</button>
        </div>
        <div id="new-error"></div>
      </div>
    </div>
  </div>

  <!-- 终端工具条 + 终端容器 -->
  <div id="term-wrap" class="hidden">
    <div id="terminal-toolbar">
      <span id="toolbar-title">Web Shell</span>
      <span id="toolbar-welcome">欢迎使用 Web Shell</span>
      <div id="font-controls">
        <button type="button" id="btn-sessions" title="返回会话列表（断开当前终端）">会话</button>
        <button type="button" id="btn-upload" title="上传文件到当前终端目录">上传</button>
        <input type="file" id="file-input" class="hidden">
        <button type="button" id="btn-font-minus" title="减小字体">A-</button>
        <span id="font-size-label">14px</span>
        <button type="button" id="btn-font-plus" title="增大字体">A+</button>
        <select id="theme-select" title="选择终端主题">
          <option value="vscode-dark">VS Code Dark</option>
          <option value="dracula">Dracula</option>
          <option value="monokai">Monokai</option>
          <option value="nord">Nord</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="one-dark">One Dark</option>
          <option value="tokyo-night">Tokyo Night</option>
          <option value="github-light">GitHub Light</option>
        </select>
      </div>
    </div>
    <div id="terminal"></div>
  </div>

  <!-- 通用消息弹窗（div，非浏览器 alert） -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-message"></div>
      <button type="button" id="modal-ok">确定</button>
    </div>
  </div>

  <!-- API Key 输入弹窗 -->
  <div id="auth-overlay" class="hidden">
    <div id="auth-box">
      <div id="auth-title">请输入 API Key</div>
      <p id="auth-hint">以下环境变量在 AI 代理配置中被引用，请输入对应的 API Key：</p>
      <div id="auth-fields"></div>
      <div id="auth-actions">
        <button type="button" id="auth-cancel-btn">取消</button>
        <button type="button" id="auth-ok-btn">确定</button>
      </div>
    </div>
  </div>

  <!-- 上传进度弹窗 -->
  <div id="upload-overlay" class="hidden">
    <div id="upload-box">
      <div id="upload-title">正在上传...</div>
      <div id="upload-filename"></div>
      <div id="upload-bar-wrap">
        <div id="upload-bar"></div>
      </div>
      <div id="upload-percent">0%</div>
      <div id="upload-actions">
        <button type="button" id="upload-cancel">取消上传</button>
      </div>
    </div>
  </div>

  <!-- xterm.js core（自托管） -->
  <script src="/static/vendor/xterm.js"></script>
  <!-- xterm.js fit addon（自托管） -->
  <script src="/static/vendor/addon-fit.js"></script>

  <!-- 本地前端逻辑 -->
  <script src="/static/app.js"></script>
</body>
</html>
